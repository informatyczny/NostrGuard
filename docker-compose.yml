services:
  relay:
    build:
      context: .
      dockerfile: relay.Dockerfile
    volumes:
      - ./strfry.conf:/etc/strfry.conf:ro
      - ./scripts/relay_policy.py:/app/scripts/relay_policy.py:ro
      - relay-data:/app/strfry-db
    command: ["--config=/etc/strfry.conf", "relay"]
    # Not exposed to host — nginx proxies WebSocket connections internally

  backend:
    build: ./backend
    volumes:
      - backend-data:/app/data
      - backend-logs:/app/logs
    # Not exposed to host — nginx proxies /api/* internally

  frontend:
    build:
      context: ./frontend
      args:
        PUBLIC_API_BASE: ""
    ports:
      - "80:80"
    depends_on:
      - relay
      - backend

volumes:
  relay-data:
  backend-data:
  backend-logs:
